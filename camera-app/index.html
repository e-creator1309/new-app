<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Camera" />
  <meta name="description" content="Simple, private camera app. No uploads, no tracking." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <title>Camera</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Viewfinder */
    #viewfinder {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    /* Capture flash overlay */
    #flash-overlay {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.05s ease;
    }
    #flash-overlay.active { opacity: 1; }

    /* Controls bar */
    #controls {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      padding: 20px 24px max(24px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
      z-index: 20;
    }

    /* Top bar */
    #topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: max(16px, env(safe-area-inset-top)) 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
      z-index: 20;
    }

    /* Icon buttons */
    .icon-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .icon-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.25); }
    .icon-btn.active { background: rgba(255,220,0,0.35); }

    /* Shutter */
    #shutter {
      width: 76px; height: 76px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: rgba(255,255,255,0.9);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s, background 0.1s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.3);
    }
    #shutter:active { transform: scale(0.88); background: #ddd; }

    /* Thumbnail preview */
    #thumbnail {
      width: 48px; height: 48px;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.6);
      object-fit: cover;
      background: rgba(255,255,255,0.1);
      cursor: pointer;
      display: none;
      overflow: hidden;
      transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    #thumbnail.visible { display: block; }
    #thumbnail:active { transform: scale(0.93); }

    /* Torch icon states */
    #torch-btn svg .torch-on { display: none; }
    #torch-btn.active svg .torch-on { display: inline; }
    #torch-btn.active svg .torch-off { display: none; }

    /* Error / permission screen */
    #permission-screen {
      position: absolute;
      inset: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      z-index: 100;
      gap: 16px;
      color: #fff;
    }
    #permission-screen.hidden { display: none; }
    #permission-screen .perm-icon { font-size: 64px; margin-bottom: 8px; }
    #permission-screen h2 { font-size: 22px; font-weight: 600; }
    #permission-screen p { font-size: 15px; color: rgba(255,255,255,0.6); line-height: 1.5; max-width: 280px; }
    #permission-screen button {
      margin-top: 8px;
      padding: 14px 32px;
      border-radius: 50px;
      border: none;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }
    #permission-screen button:active { opacity: 0.85; }

    /* Install banner */
    #install-banner {
      position: absolute;
      top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      padding: max(16px, env(safe-area-inset-top)) 16px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 50;
      transform: translateY(-100%);
      transition: transform 0.3s ease;
    }
    #install-banner.show { transform: translateY(0); }
    #install-banner .install-icon { font-size: 28px; flex-shrink: 0; }
    #install-banner .install-text { flex: 1; }
    #install-banner .install-text strong { display: block; font-size: 14px; }
    #install-banner .install-text span { font-size: 12px; color: rgba(255,255,255,0.6); }
    #install-banner .install-actions { display: flex; gap: 8px; flex-shrink: 0; }
    #install-banner button {
      padding: 8px 16px; border-radius: 20px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer; touch-action: manipulation;
    }
    #btn-install { background: #fff; color: #000; }
    #btn-dismiss-install { background: rgba(255,255,255,0.15); color: #fff; }

    /* SVG icons */
    svg { display: block; }

    /* Zoom indicator */
    #zoom-label {
      position: absolute;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    #zoom-label.show { opacity: 1; }
  </style>
</head>
<body>
<div id="app">

  <!-- Camera feed -->
  <video id="viewfinder" autoplay playsinline muted></video>
  <div id="flash-overlay"></div>

  <!-- Permission / error screen -->
  <div id="permission-screen">
    <div class="perm-icon">📷</div>
    <h2>Camera Access Needed</h2>
    <p>This app needs your camera. Your photos never leave your device.</p>
    <button id="btn-request-cam">Allow Camera</button>
  </div>

  <!-- Top bar -->
  <div id="topbar">
    <button class="icon-btn" id="torch-btn" title="Torch">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- torch off = flash off icon -->
        <line class="torch-off" x1="8.56" y1="2.75" x2="4.34" y2="9.96" />
        <line class="torch-off" x1="2.75" y1="8.56" x2="9.96" y2="4.34" />
        <line class="torch-off" x1="2" y1="2" x2="22" y2="22" />
        <path class="torch-off" d="m10.071 10.071-5.657 5.657a2 2 0 0 0 0 2.828l2.829 2.829a2 2 0 0 0 2.828 0l5.657-5.657" />
        <!-- torch on = flash bolt icon -->
        <polygon class="torch-on" points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
      </svg>
    </button>
    <div style="font-size:13px;color:rgba(255,255,255,0.7);font-weight:500;letter-spacing:0.5px;">CAMERA</div>
    <button class="icon-btn" id="settings-btn" title="Settings" style="opacity:0;pointer-events:none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </button>
  </div>

  <!-- Zoom label -->
  <div id="zoom-label">1×</div>

  <!-- Bottom controls -->
  <div id="controls">
    <img id="thumbnail" alt="Last photo" title="Last photo" />
    <button id="shutter" title="Take photo" aria-label="Take photo"></button>
    <button class="icon-btn" id="flip-btn" title="Flip camera">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
        <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
        <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
        <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
        <path d="m8 8 4-4 4 4"/>
        <path d="m16 16-4 4-4-4"/>
      </svg>
    </button>
  </div>

  <!-- Install banner -->
  <div id="install-banner">
    <div class="install-icon">📷</div>
    <div class="install-text">
      <strong>Install Camera App</strong>
      <span>Add to home screen — works offline</span>
    </div>
    <div class="install-actions">
      <button id="btn-install">Install</button>
      <button id="btn-dismiss-install">✕</button>
    </div>
  </div>

</div>

<canvas id="capture-canvas" style="display:none;"></canvas>

<script>
(function() {
  'use strict';

  const video = document.getElementById('viewfinder');
  const canvas = document.getElementById('capture-canvas');
  const flashOverlay = document.getElementById('flash-overlay');
  const shutterBtn = document.getElementById('shutter');
  const flipBtn = document.getElementById('flip-btn');
  const torchBtn = document.getElementById('torch-btn');
  const thumbnail = document.getElementById('thumbnail');
  const permScreen = document.getElementById('permission-screen');
  const btnRequestCam = document.getElementById('btn-request-cam');
  const installBanner = document.getElementById('install-banner');
  const btnInstall = document.getElementById('btn-install');
  const btnDismissInstall = document.getElementById('btn-dismiss-install');
  const zoomLabel = document.getElementById('zoom-label');

  let stream = null;
  let facingMode = 'environment'; // back camera first
  let torchOn = false;
  let torchSupported = false;
  let photoCount = 0;
  let deferredInstallPrompt = null;
  let currentZoom = 1;
  let zoomTimeout = null;
  let pinchStartDist = 0;
  let pinchStartZoom = 1;

  // ── Service Worker ──────────────────────────────────────────────
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // ── PWA Install ─────────────────────────────────────────────────
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredInstallPrompt = e;
    // Show banner only if not standalone and dismissed flag not set
    if (!window.matchMedia('(display-mode: standalone)').matches && !sessionStorage.getItem('install-dismissed')) {
      setTimeout(() => installBanner.classList.add('show'), 2000);
    }
  });

  btnInstall.addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;
    installBanner.classList.remove('show');
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
  });

  btnDismissInstall.addEventListener('click', () => {
    installBanner.classList.remove('show');
    sessionStorage.setItem('install-dismissed', '1');
  });

  // ── Camera ──────────────────────────────────────────────────────
  async function startCamera(facing) {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }

    const constraints = {
      video: {
        facingMode: { ideal: facing },
        width: { ideal: 3840 },
        height: { ideal: 2160 },
      },
      audio: false
    };

    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      permScreen.classList.add('hidden');
      await video.play();
      checkTorchSupport();
    } catch (err) {
      console.error('Camera error:', err);
      permScreen.classList.remove('hidden');
    }
  }

  function checkTorchSupport() {
    const track = stream && stream.getVideoTracks()[0];
    if (!track) return;
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    torchSupported = !!(caps.torch);
    torchBtn.style.opacity = torchSupported ? '1' : '0.35';
    torchBtn.style.pointerEvents = torchSupported ? 'auto' : 'none';
    // reset torch state
    torchOn = false;
    torchBtn.classList.remove('active');
  }

  async function toggleTorch() {
    if (!torchSupported) return;
    const track = stream && stream.getVideoTracks()[0];
    if (!track) return;
    try {
      torchOn = !torchOn;
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      torchBtn.classList.toggle('active', torchOn);
    } catch (e) {
      torchOn = !torchOn;
    }
  }

  // ── Capture ─────────────────────────────────────────────────────
  function capturePhoto() {
    if (!stream) return;
    const w = video.videoWidth;
    const h = video.videoHeight;
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    // Mirror if front camera
    if (facingMode === 'user') {
      ctx.translate(w, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(video, 0, 0, w, h);

    // Flash
    flashOverlay.classList.add('active');
    setTimeout(() => flashOverlay.classList.remove('active'), 100);

    canvas.toBlob(blob => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      // Show thumbnail
      thumbnail.src = url;
      thumbnail.classList.add('visible');
      // Auto-download
      const a = document.createElement('a');
      a.href = url;
      a.download = `photo_${Date.now()}.jpg`;
      a.click();
      // Tap thumbnail to re-download last photo
      thumbnail.onclick = () => {
        const a2 = document.createElement('a');
        a2.href = url;
        a2.download = `photo_${Date.now()}.jpg`;
        a2.click();
      };
    }, 'image/jpeg', 0.95);
  }

  // ── Zoom ─────────────────────────────────────────────────────────
  function applyZoom(zoom) {
    const track = stream && stream.getVideoTracks()[0];
    if (!track) return;
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (!caps.zoom) return;
    const min = caps.zoom.min ?? 1;
    const max = caps.zoom.max ?? 1;
    zoom = Math.max(min, Math.min(max, zoom));
    track.applyConstraints({ advanced: [{ zoom }] }).catch(() => {});
    currentZoom = zoom;
    zoomLabel.textContent = zoom.toFixed(1) + '×';
    zoomLabel.classList.add('show');
    clearTimeout(zoomTimeout);
    zoomTimeout = setTimeout(() => zoomLabel.classList.remove('show'), 1500);
  }

  // Pinch-to-zoom
  video.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      pinchStartDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      pinchStartZoom = currentZoom;
    }
  }, { passive: false });

  video.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const scale = dist / pinchStartDist;
      applyZoom(pinchStartZoom * scale);
    }
  }, { passive: false });

  // Scroll to zoom fallback (desktop)
  video.addEventListener('wheel', e => {
    e.preventDefault();
    applyZoom(currentZoom + (e.deltaY < 0 ? 0.1 : -0.1));
  }, { passive: false });

  // ── Events ───────────────────────────────────────────────────────
  btnRequestCam.addEventListener('click', () => startCamera(facingMode));

  shutterBtn.addEventListener('click', capturePhoto);

  flipBtn.addEventListener('click', () => {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    currentZoom = 1;
    startCamera(facingMode);
  });

  torchBtn.addEventListener('click', toggleTorch);

  // Volume button shutter (if supported)
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ' || e.code === 'VolumeUp' || e.code === 'VolumeDown') {
      e.preventDefault();
      capturePhoto();
    }
  });

  // ── Init ─────────────────────────────────────────────────────────
  // Check if we already have permission
  if (navigator.permissions) {
    navigator.permissions.query({ name: 'camera' }).then(result => {
      if (result.state === 'granted') {
        startCamera(facingMode);
      }
      // else show permission screen
    }).catch(() => {
      // Permissions API not supported, try anyway
      startCamera(facingMode);
    });
  } else {
    startCamera(facingMode);
  }

  // Wake lock — keep screen on while camera is open
  let wakeLock = null;
  async function requestWakeLock() {
    if ('wakeLock' in navigator) {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
      } catch (e) {}
    }
  }
  requestWakeLock();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') requestWakeLock();
  });

})();
</script>
</body>
</html>
